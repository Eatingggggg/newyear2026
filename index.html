<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 新年快樂</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            touch-action: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .title-container {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            width: 100%;
            pointer-events: none;
        }

        h1 {
            color: #fff;
            font-size: 12vw;
            /* 霓虹文字效果 */
            text-shadow: 0 0 10px #fff, 0 0 20px #ff0055, 0 0 40px #ff0055;
            margin: 0;
            animation: glow 1s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { opacity: 0.9; transform: scale(1); }
            to { opacity: 1; transform: scale(1.05); text-shadow: 0 0 20px #fff, 0 0 30px #ffcc00, 0 0 50px #ffcc00; }
        }

        canvas { display: block; }
    </style>
</head>
<body>

    <div class="title-container">
        <h1>Happy New Year<br>2026</h1>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 粒子類別：負責爆炸後的彩色點點
        class Particle {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                // 讓每個粒子在該次煙火的主色調周圍隨機跳動，達成多色效果
                this.hue = hue + (Math.random() * 60 - 30); 
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 10 + 2; // 爆炸速度快
                this.friction = 0.95;
                this.gravity = 0.2;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.015;
            }

            update() {
                this.speed *= this.friction;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed + this.gravity;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                // 使用 HSL 讓顏色更鮮艷
                ctx.fillStyle = `hsl(${this.hue}, 100%, 60%)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fill();
                
                // 增加光暈效果，讓粒子看起來在發光
                ctx.shadowBlur = 10;
                ctx.shadowColor = `hsl(${this.hue}, 100%, 50%)`;
                ctx.restore();
            }
        }

        // 煙火類別：負責上升與觸發爆炸
        class Firework {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height;
                this.targetY = Math.random() * (canvas.height * 0.4) + 100;
                this.speed = 12; // 極速上升
                this.particles = [];
                this.exploded = false;
                this.hue = Math.random() * 360; // 隨機主色調
            }

            update() {
                if (!this.exploded) {
                    this.y -= this.speed;
                    if (this.y <= this.targetY) {
                        this.exploded = true;
                        this.explode();
                    }
                }
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    this.particles[i].update();
                    if (this.particles[i].alpha <= 0) this.particles.splice(i, 1);
                }
            }

            explode() {
                // 增加粒子數量到 80 顆，讓畫面更滿更華麗
                for (let i = 0; i < 80; i++) {
                    this.particles.push(new Particle(this.x, this.y, this.hue));
                }
            }

            draw() {
                if (!this.exploded) {
                    ctx.fillStyle = `hsl(${this.hue}, 100%, 70%)`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
                this.particles.forEach(p => p.draw());
            }
        }

        let fireworks = [];
        function animate() {
            // 背景半透明填充，營造煙火殘影（拖尾）效果
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 隨機自動產生煙火，頻率調高
            if (Math.random() < 0.08) {
                fireworks.push(new Firework());
            }

            fireworks.forEach((fw, i) => {
                fw.update();
                fw.draw();
                if (fw.exploded && fw.particles.length === 0) {
                    fireworks.splice(i, 1);
                }
            });

            requestAnimationFrame(animate);
        }

        // 手機觸控發射：點哪裡炸哪裡
        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            let fw = new Firework();
            fw.x = touch.clientX;
            fw.targetY = touch.clientY;
            fw.speed = 15; // 手動點擊的速度更快
            fireworks.push(fw);
        });

        animate();
    </script>
</body>
</html>
