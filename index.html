<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 新年快樂</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            touch-action: none; /* 防止手機縮放與滾動干擾 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .title-container {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
            width: 100%;
            pointer-events: none;
        }

        h1 {
            color: #fff;
            font-size: 12vw; /* 根據手機寬度自動調整大小 */
            text-shadow: 0 0 15px #ff0055;
            margin: 0;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055; opacity: 0.8; }
            to { text-shadow: 0 0 20px #ffcc00, 0 0 40px #ffcc00; opacity: 1; }
        }

        canvas { display: block; }
    </style>
</head>
<body>

    <div class="title-container">
        <h1>Happy New Year<br>2026</h1>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // 初始化畫布大小
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                this.hue = hue;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 5 + 1;
                this.friction = 0.96;
                this.gravity = 0.15;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.015;
            }
            update() {
                this.speed *= this.friction;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed + this.gravity;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = `hsl(${this.hue}, 100%, 60%)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Firework {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height;
                this.targetY = Math.random() * (canvas.height * 0.5);
                this.speed = 8;
                this.particles = [];
                this.exploded = false;
                this.hue = Math.random() * 360;
            }
            update() {
                if (!this.exploded) {
                    this.y -= this.speed;
                    if (this.y <= this.targetY) {
                        this.exploded = true;
                        for(let i=0; i<50; i++) this.particles.push(new Particle(this.x, this.y, this.hue));
                    }
                }
                for(let i = this.particles.length - 1; i >= 0; i--) {
                    this.particles[i].update();
                    if(this.particles[i].alpha <= 0) this.particles.splice(i, 1);
                }
            }
            draw() {
                if (!this.exploded) {
                    ctx.fillStyle = `hsl(${this.hue}, 100%, 70%)`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
                this.particles.forEach(p => p.draw());
            }
        }

        let fireworks = [];
        function animate() {
            // 尾跡效果
            ctx.globalAlpha = 1;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (Math.random() < 0.04) fireworks.push(new Firework());

            fireworks.forEach((fw, i) => {
                fw.update();
                fw.draw();
                if (fw.exploded && fw.particles.length === 0) fireworks.splice(i, 1);
            });
            requestAnimationFrame(animate);
        }

        // 手機觸控點擊發射
        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            let fw = new Firework();
            fw.x = touch.clientX;
            fw.targetY = touch.clientY;
            fireworks.push(fw);
        });

        animate();
    </script>
</body>
</html>
